<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal — FarmTracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>FarmTracker</h1>
    <nav>
      <a href="index.html">Paddocks</a>
      <a href="animals.html" class="active">Animals</a>
    </nav>
  </header>
  <main>
    <a href="animals.html" class="back-link">← Back to Animals</a>
    <div id="animal-detail"><p class="loading">Loading…</p></div>

    <section id="health-section" style="display:none">
      <h3>Health Events</h3>
      <table>
        <thead>
          <tr><th>Date</th><th>Type</th><th>Vet</th><th>Notes</th></tr>
        </thead>
        <tbody id="events-body"></tbody>
      </table>

      <h4>Log Health Event</h4>
      <form id="event-form">
        <label>Type
          <select name="event_type" required>
            <option value="vaccination">Vaccination</option>
            <option value="checkup">Checkup</option>
            <option value="treatment">Treatment</option>
            <option value="injury">Injury</option>
          </select>
        </label>
        <label>Date <input type="date" name="date" required></label>
        <label>Vet <input type="text" name="vet_name" placeholder="Optional"></label>
        <label>Notes <input type="text" name="notes" placeholder="Optional"></label>
        <button type="submit">Log Event</button>
      </form>
    </section>

    <section id="weight-section" style="display:none">
      <h3>Weight History</h3>
      <p id="latest-weight" class="latest-weight">No weight records yet.</p>
      <table>
        <thead>
          <tr><th>Date</th><th>Weight (kg)</th><th>Notes</th></tr>
        </thead>
        <tbody id="weights-body"></tbody>
      </table>

      <h4>Log Weight</h4>
      <form id="weight-form">
        <label>Weight (kg) <input type="number" name="weight_kg" step="0.1" min="0.1" required></label>
        <label>Date <input type="date" name="date" required></label>
        <label>Notes <input type="text" name="notes" placeholder="Optional"></label>
        <button type="submit">Log Weight</button>
        <p class="error-msg" id="weight-error" style="display:none"></p>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const animalId = params.get('id');

    function makeRow(cells, fallback) {
      const row = document.createElement('tr');
      cells.forEach(val => {
        const td = document.createElement('td');
        td.textContent = (val != null && val !== '') ? val : (fallback ?? '—');
        row.appendChild(td);
      });
      return row;
    }

    function emptyRow(colspan, msg) {
      const row = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = colspan;
      td.className = 'empty';
      td.textContent = msg;
      row.appendChild(td);
      return row;
    }

    async function load() {
      const animal = await api.get(`/animals/${animalId}`);

      document.title = `${animal.name} — FarmTracker`;

      const detail = document.getElementById('animal-detail');
      detail.replaceChildren();

      const header = document.createElement('div');
      header.className = 'animal-header';
      const h2 = document.createElement('h2');
      h2.textContent = animal.name;
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = animal.tag_number;
      h2.appendChild(tag);
      header.appendChild(h2);
      detail.appendChild(header);

      const dl = document.createElement('dl');
      [
        ['Breed', animal.breed ?? '—'],
        ['Date of Birth', animal.date_of_birth ?? '—'],
        ['Paddock', animal.paddock_name ?? 'Unassigned'],
      ].forEach(([label, value]) => {
        const dt = document.createElement('dt');
        dt.textContent = label;
        const dd = document.createElement('dd');
        dd.textContent = value;
        dl.appendChild(dt);
        dl.appendChild(dd);
      });
      detail.appendChild(dl);

      document.getElementById('health-section').style.display = 'block';
      document.getElementById('weight-section').style.display = 'block';
      await loadEvents();
      await loadWeights();
    }

    async function loadEvents() {
      const events = await api.get(`/animals/${animalId}/health-events`);
      const tbody = document.getElementById('events-body');
      tbody.replaceChildren();
      if (!events.length) {
        tbody.appendChild(emptyRow(4, 'No events recorded.'));
        return;
      }
      events.forEach(e => {
        tbody.appendChild(makeRow([e.date, e.event_type, e.vet_name, e.notes]));
      });
    }

    async function loadWeights() {
      const weights = await api.get(`/animals/${animalId}/weights`);
      const tbody = document.getElementById('weights-body');
      const latestEl = document.getElementById('latest-weight');
      tbody.replaceChildren();

      if (!weights.length) {
        latestEl.textContent = 'No weight records yet.';
        tbody.appendChild(emptyRow(3, 'No weight records.'));
        return;
      }

      const latest = weights[0];
      const formatted = new Date(latest.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      latestEl.textContent = `Latest: ${latest.weight_kg} kg on ${formatted}`;

      weights.forEach(w => {
        tbody.appendChild(makeRow([w.date, w.weight_kg, w.notes]));
      });
    }

    document.getElementById('event-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      await api.post(`/animals/${animalId}/health-events`, data);
      e.target.reset();
      await loadEvents();
    });

    document.getElementById('weight-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('weight-error');
      errorEl.style.display = 'none';
      const data = Object.fromEntries(new FormData(e.target));
      data.weight_kg = parseFloat(data.weight_kg);
      try {
        await api.post(`/animals/${animalId}/weights`, data);
        e.target.reset();
        await loadWeights();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = '';
      }
    });

    load();
  </script>
</body>
</html>
