<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmTracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>FarmTracker</h1>
    <nav>
      <a href="index.html" class="active">Paddocks</a>
      <a href="animals.html">Animals</a>
    </nav>
  </header>
  <main>
    <div class="page-header">
      <h2>Paddocks</h2>
    </div>
    <div id="paddocks-grid" class="card-grid">
      <p class="loading">Loading…</p>
    </div>
  </main>
  <script src="app.js"></script>
  <script>
    async function loadPaddocks() {
      const paddocks = await api.get('/paddocks');
      const grid = document.getElementById('paddocks-grid');
      grid.replaceChildren();

      if (!paddocks.length) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = 'No paddocks found.';
        grid.appendChild(p);
        return;
      }

      paddocks.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';

        const h3 = document.createElement('h3');
        h3.textContent = p.name;

        const stat = document.createElement('p');
        stat.className = 'stat';
        stat.textContent = `${p.animal_count} / ${p.capacity} animals`;

        const bar = document.createElement('div');
        bar.className = 'capacity-bar';
        const fill = document.createElement('div');
        fill.className = 'capacity-fill';
        fill.style.width = `${Math.min(100, Math.round((p.animal_count / p.capacity) * 100))}%`;
        bar.appendChild(fill);

        card.appendChild(h3);
        card.appendChild(stat);
        card.appendChild(bar);
        grid.appendChild(card);
      });
    }

    loadPaddocks();
  </script>
</body>
</html>
