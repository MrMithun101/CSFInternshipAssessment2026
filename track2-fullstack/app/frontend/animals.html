<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animals — FarmTracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>FarmTracker</h1>
    <nav>
      <a href="index.html">Paddocks</a>
      <a href="animals.html" class="active">Animals</a>
    </nav>
  </header>
  <main>
    <div class="page-header">
      <h2>Animals</h2>
    </div>
    <table>
      <thead>
        <tr>
          <th>Tag</th>
          <th>Name</th>
          <th>Breed</th>
          <th>Paddock</th>
          <th>Latest Health Event</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="animals-body">
        <tr><td colspan="6" class="loading">Loading…</td></tr>
      </tbody>
    </table>
    <div class="pagination">
      <button id="prev-btn" onclick="changePage(-1)" disabled>Previous</button>
      <span id="page-info">Page 1</span>
      <button id="next-btn" onclick="changePage(1)">Next</button>
    </div>
  </main>
  <script src="app.js"></script>
  <script>
    let currentPage = 0;
    const LIMIT = 5;

    function text(val, fallback) {
      return document.createTextNode(val != null ? val : fallback ?? '');
    }

    function td(val, fallback) {
      const cell = document.createElement('td');
      cell.appendChild(text(val, fallback));
      return cell;
    }

    async function loadAnimals() {
      const animals = await api.get(`/animals?page=${currentPage}&limit=${LIMIT}`);
      const tbody = document.getElementById('animals-body');
      tbody.replaceChildren();

      if (!animals.length) {
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 6;
        cell.className = 'empty';
        cell.textContent = 'No animals found.';
        row.appendChild(cell);
        tbody.appendChild(row);
        document.getElementById('next-btn').disabled = true;
        return;
      }

      animals.forEach(a => {
        const row = document.createElement('tr');
        const ev = a.latest_health_event;
        const eventText = ev ? `${ev.event_type} (${ev.date})` : '—';
        const linkCell = document.createElement('td');
        const link = document.createElement('a');
        link.href = `animal-detail.html?id=${a.id}`;
        link.textContent = 'View';
        linkCell.appendChild(link);

        row.appendChild(td(a.tag_number));
        row.appendChild(td(a.name));
        row.appendChild(td(a.breed, '—'));
        row.appendChild(td(a.paddock_name, 'Unassigned'));
        row.appendChild(td(eventText));
        row.appendChild(linkCell);
        tbody.appendChild(row);
      });

      document.getElementById('page-info').textContent = `Page ${currentPage + 1}`;
      document.getElementById('prev-btn').disabled = currentPage === 0;
      document.getElementById('next-btn').disabled = animals.length < LIMIT;
    }

    function changePage(dir) {
      currentPage = Math.max(0, currentPage + dir);
      loadAnimals();
    }

    loadAnimals();
  </script>
</body>
</html>
