<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animals — FarmTracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>FarmTracker</h1>
    <nav>
      <a href="index.html">Paddocks</a>
      <a href="animals.html" class="active">Animals</a>
    </nav>
  </header>
  <main>
    <div class="page-header">
      <h2>Animals</h2>
    </div>
    <div class="search-bar">
      <input type="text" id="tag-search" placeholder="Search by tag number…" oninput="onTagInput(this.value)">
      <button onclick="clearSearch()">Clear</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Tag</th>
          <th>Name</th>
          <th>Breed</th>
          <th>Paddock</th>
          <th>Latest Health Event</th>
          <th>Latest Weight</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="animals-body">
        <tr><td colspan="7" class="loading">Loading…</td></tr>
      </tbody>
    </table>
    <div class="pagination">
      <button id="prev-btn" onclick="changePage(-1)" disabled>Previous</button>
      <span id="page-info">Page 1</span>
      <button id="next-btn" onclick="changePage(1)">Next</button>
    </div>
  </main>
  <script src="app.js"></script>
  <script>
    let currentPage = 0;
    let currentTag  = '';
    const LIMIT = 5;

    function text(val, fallback) {
      return document.createTextNode(val != null ? val : fallback ?? '');
    }

    function td(val, fallback) {
      const cell = document.createElement('td');
      cell.appendChild(text(val, fallback));
      return cell;
    }

    let searchTimeout;
    function onTagInput(val) {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        currentTag  = val.trim();
        currentPage = 0;
        loadAnimals();
      }, 300);
    }

    function clearSearch() {
      document.getElementById('tag-search').value = '';
      currentTag  = '';
      currentPage = 0;
      loadAnimals();
    }

    async function loadAnimals() {
      const url = currentTag
        ? `/animals?tag=${encodeURIComponent(currentTag)}`
        : `/animals?page=${currentPage}&limit=${LIMIT}`;
      const animals = await api.get(url);
      const tbody = document.getElementById('animals-body');
      tbody.replaceChildren();

      if (!animals.length) {
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 7;
        cell.className = 'empty';
        cell.textContent = 'No animals found.';
        row.appendChild(cell);
        tbody.appendChild(row);
        document.getElementById('next-btn').disabled = true;
        return;
      }

      animals.forEach(a => {
        const row = document.createElement('tr');

        // At-risk rows get a subtle visual treatment so farmers can spot
        // animals needing attention without opening each detail page.
        if (a.at_risk) row.className = 'at-risk-row';

        const ev = a.latest_health_event;
        const eventText = ev ? `${ev.event_type} (${ev.date})` : '—';

        // Name cell: append a warning badge if the animal is flagged at-risk.
        const nameCell = document.createElement('td');
        nameCell.appendChild(document.createTextNode(a.name ?? ''));
        if (a.at_risk) {
          const badge = document.createElement('span');
          badge.className = 'at-risk-badge';
          badge.textContent = ' ⚠';
          badge.title = `At risk: ${a.risk_reasons.join(', ')}`;
          nameCell.appendChild(badge);
        }

        // Latest weight cell with optional trend indicator (▲ gaining / ▼ losing).
        const weightCell = document.createElement('td');
        const lw = a.latest_weight;
        if (lw) {
          weightCell.appendChild(document.createTextNode(`${lw.weight_kg} kg`));
          if (lw.trend != null) {
            const trendSpan = document.createElement('span');
            const arrow = lw.trend > 0 ? '▲' : lw.trend < 0 ? '▼' : '—';
            const absVal = Math.abs(lw.trend).toFixed(1);
            trendSpan.textContent = ` ${arrow} ${absVal}`;
            trendSpan.className = lw.trend > 0 ? 'trend-up' : 'trend-down';
            weightCell.appendChild(trendSpan);
          }
        } else {
          weightCell.textContent = '—';
        }

        const linkCell = document.createElement('td');
        const link = document.createElement('a');
        link.href = `animal-detail.html?id=${a.id}`;
        link.textContent = 'View';
        linkCell.appendChild(link);

        row.appendChild(td(a.tag_number));
        row.appendChild(nameCell);
        row.appendChild(td(a.breed, '—'));
        row.appendChild(td(a.paddock_name, 'Unassigned'));
        row.appendChild(td(eventText));
        row.appendChild(weightCell);
        row.appendChild(linkCell);
        tbody.appendChild(row);
      });

      // Hide pagination controls during tag search — results are unfiltered by page.
      const pagination = document.querySelector('.pagination');
      if (currentTag) {
        pagination.style.visibility = 'hidden';
      } else {
        pagination.style.visibility = 'visible';
        document.getElementById('page-info').textContent = `Page ${currentPage + 1}`;
        document.getElementById('prev-btn').disabled = currentPage === 0;
        document.getElementById('next-btn').disabled = animals.length < LIMIT;
      }
    }

    function changePage(dir) {
      currentPage = Math.max(0, currentPage + dir);
      loadAnimals();
    }

    loadAnimals();
  </script>
</body>
</html>
